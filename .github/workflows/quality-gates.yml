name: Tophat

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse tracked JavaScript and CommonJS files
        run: |
          git ls-files -z '*.js' '*.cjs' | xargs -0 -r -n 1 node --check

  manifest:
    name: Manifest integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify packaged resource references
        run: node tests/ci/validate-extension.cjs

  prepare-tests:
    name: Shared Playwright and Chromium setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies and Chromium once
        run: |
          # PDF.js 6 requires Map.getOrInsertComputed (Chromium 145+).
          npm install --no-save --package-lock=false playwright@1.58.2 jsdom@26.1.0
          node node_modules/playwright/cli.js install chromium
          tar -czf node-dependencies.tar.gz node_modules
          tar -czf chromium.tar.gz -C "$HOME/.cache/ms-playwright" .
      - uses: actions/upload-artifact@v4
        with:
          name: node-test-dependencies
          path: node-dependencies.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-test-browser
          path: chromium.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  node-unit:
    name: Node unit tests
    needs: prepare-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: node-test-dependencies
      - name: Restore test dependencies
        run: tar -xzf node-dependencies.tar.gz && rm node-dependencies.tar.gz
      - name: Run complete Node unit suite
        run: node --test tests/*.test.cjs

  python-native:
    name: Python native host
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile native Python sources
        run: python -m compileall -q native
      - name: Test native host and report publisher
        run: python -m unittest discover -s tests -p '*_test.py' -v

  # The message-queue tests are top-level tests. Assign cases exclusively in
  # this order: scrolling, rich clipboard/attachments, composer/draft,
  # response lifecycle, then all remaining queue tests. The complementary
  # patterns cover newly added cases without running any case twice.
  browser-required:
    name: ${{ matrix.name }}
    needs: prepare-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium extension startup
            command: |
              node --test tests/compact-startup.browser.cjs tests/dashboard-startup.browser.cjs tests/refresh-view.browser.cjs
              node --test --test-name-pattern="reasoning policy" tests/chat-display.browser.cjs
          - name: Chromium message queue and delivery
            command: node --test --test-name-pattern='^(?!.*(?:[Ss]croll|[Rr]eflow|[Cc]lipboard|[Aa]ttachment|[Aa]pp (mention|identity|chip|restoration)|[Pp]lugin|file (bytes|cards)|queues an image|saved image-only|selected text|[Cc]omposer|[Dd]raft|[Rr]esponse|[Aa]ssistant|[Gg]enerat|[Tt]hinking|[Hh]istory|[Ww]ork completion|image-only reply|[Cc]ompletion|[Ss]treaming)).*$' tests/message-queue.browser.cjs
          - name: Chromium response lifecycle
            command: node --test --test-name-pattern='^(?!.*(?:[Ss]croll|[Rr]eflow|[Cc]lipboard|[Aa]ttachment|[Aa]pp (mention|identity|chip|restoration)|[Pp]lugin|file (bytes|cards)|queues an image|saved image-only|selected text|[Cc]omposer|[Dd]raft)).*(?:[Rr]esponse|[Aa]ssistant|[Gg]enerat|[Tt]hinking|[Hh]istory|[Ww]ork completion|image-only reply|[Cc]ompletion|[Ss]treaming)' tests/message-queue.browser.cjs
          - name: Chromium composer and draft preservation
            command: node --test --test-name-pattern='^(?!.*(?:[Ss]croll|[Rr]eflow|[Cc]lipboard|[Aa]ttachment|[Aa]pp (mention|identity|chip|restoration)|[Pp]lugin|file (bytes|cards)|queues an image|saved image-only|selected text)).*(?:[Cc]lipboard|[Aa]ttachment|[Aa]pp (mention|identity|chip|restoration)|[Pp]lugin|file (bytes|cards)|queues an image|saved image-only|selected text|[Cc]omposer|[Dd]raft)' tests/message-queue.browser.cjs
          - name: Chromium clipboard, attachments and app mentions
            command: node --test --test-name-pattern='^(?!.*(?:[Ss]croll|[Rr]eflow)).*(?:[Cc]lipboard|[Aa]ttachment|[Aa]pp (mention|identity|chip|restoration)|[Pp]lugin|file (bytes|cards)|queues an image|saved image-only|selected text)' tests/message-queue.browser.cjs
          - name: Chromium scrolling and layout
            command: node --test --test-name-pattern='[Ss]croll|[Rr]eflow' tests/message-queue.browser.cjs
          - name: Chromium manual web search controls
            command: node --test tests/disable-manual-web-search.browser.cjs
          - name: Chromium links and source-image safety
            command: |
              node --test --test-name-pattern="source SVG event handlers" tests/unavailable-images.browser.cjs
              node --test --test-name-pattern="modern conversation roles|own-message links|external-link arrows|hidden arrow wrappers" tests/external-links.browser.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/restore-chromium
      - name: Test ${{ matrix.name }}
        run: ${{ matrix.command }}

  # These existing suites have unrelated, known-red baselines. Report their
  # real failures without putting them in the required regression aggregate.
  browser-extended:
    name: ${{ matrix.name }}
    needs: prepare-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium highlights and YouTube (advisory)
            command: node --test tests/highlighted-pages.browser.cjs tests/youtube-search.browser.cjs
          - name: Chromium external links (extended, advisory)
            command: node --test --test-name-pattern='^(?!.*(?:modern conversation roles|own-message links|external-link arrows|hidden arrow wrappers)).*$' tests/external-links.browser.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/restore-chromium
      - name: Test ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Keep the original regression job context and fail it when any required
  # unit or browser job fails, is cancelled, or is skipped.
  regression:
    name: regression
    needs: [node-unit, browser-required]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required unit and browser regression results
        env:
          NODE_RESULT: ${{ needs.node-unit.result }}
          BROWSER_RESULT: ${{ needs.browser-required.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$BROWSER_RESULT" = success

  package:
    name: Extension packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate extension ZIP
        run: python3 tests/ci/package-extension.py
      - name: Upload extension archive
        uses: actions/upload-artifact@v4
        with:
          name: flawless-extension
          path: dist/flawless-extension.zip
          if-no-files-found: error
